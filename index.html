<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Cardápio Diário v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Cardápio Dinâmico</h1>

    <!-- Cadastro de Novos Alimentos -->
    <div class="section-card">
      <h3>➕ Cadastrar Novo Alimento</h3>
      <form id="form-alimento">
        <div class="form-group">
          <input type="text" id="nome-alimento" placeholder="Nome (Ex: Tapioca)" required>
          <select id="cat-alimento" required>
            <option value="" disabled selected>Categoria...</option>
            <option value="carbo">Carboidrato</option>
            <option value="proteina">Proteína</option>
            <option value="gordura">Gordura</option>
          </select>
          <input type="number" id="limite-alimento" placeholder="Limite na semana (opcional)">
          <button type="submit" class="btn-primario">Cadastrar Alimento</button>
        </div>
      </form>
    </div>

    <!-- Lista do Estoque -->
    <div class="section-card">
      <h3>📦 Meu Estoque (O que tem hoje?)</h3>
      <div id="lista-estoque" class="grid-estoque"></div>
    </div>

    <!-- Botão de Gerar Menu -->
    <button id="btn-gerar" class="btn-primario">🔄 Gerar Menu de Hoje</button>

    <!-- Área onde o Cardápio e os Alertas aparecem -->
    <div id="alertas-sistema"></div>
    <div id="conteudo-menu">
      <p style="text-align: center; color: #94a3b8; font-size: 15px;">Clique no botão acima para calcular o cardápio do dia.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
