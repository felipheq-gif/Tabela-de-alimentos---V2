<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Cardápio Diário v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Cardápio Dinâmico</h1>

    <!-- 1. Meta Diária -->
    <div class="section-card" style="background: #0f172a; border: 1px solid #334155;">
      <h4 style="color: #38bdf8; margin-bottom: 6px;">🎯 Meta do Dia: 3300 kcal</h4>
      <p style="font-size: 14px; color: #cbd5e1;" id="projecao-texto">Projeção Atual: <strong>Aguardando geração...</strong></p>
      <div id="alertas-sistema" style="margin-top: 8px;"></div>
    </div>

    <!-- 2. Botão de Gerar Menu -->
    <button id="btn-gerar" class="btn-primario">🔄 Gerar Menu de Hoje</button>

    <!-- 3. Os alimentos (Cardápio do Dia) -->
    <div id="conteudo-menu">
      <p style="text-align: center; color: #94a3b8; font-size: 15px; padding: 20px 0;">Clique no botão acima para calcular o cardápio do dia.</p>
    </div>

    <!-- 4. Cadastrar Novo Alimento (Layout em Grade Profissional) -->
    <div class="section-card">
      <h3>➕ Cadastrar Novo Alimento</h3>
      <form id="form-alimento">
        <div class="form-grid">
          <div class="form-full">
            <input type="text" id="nome-alimento" placeholder="Nome do Alimento (ex: Pão Integral)" required>
          </div>
          <div class="form-row">
            <select id="cat-alimento" required>
              <option value="" disabled selected>Categoria...</option>
              <option value="carbo">Carboidrato</option>
              <option value="proteina">Proteína</option>
              <option value="gordura">Gordura</option>
            </select>
            <input type="number" id="limite-alimento" placeholder="Máx dias/semana (ex: 2)">
          </div>
          <div class="form-row">
            <input type="number" step="0.1" id="kcal-100g" placeholder="Kcal / 100g">
            <input type="number" step="0.1" id="prot-100g" placeholder="Proteína (g)">
          </div>
          <div class="form-row">
            <input type="number" step="0.1" id="carbo-100g" placeholder="Carbo (g)">
            <input type="number" step="0.1" id="gord-100g" placeholder="Gordura (g)">
          </div>
          <div class="form-full">
            <button type="submit" class="btn-primario">Cadastrar Alimento</button>
          </div>
        </div>
      </form>
    </div>

    <!-- 5. Alimentos no Estoque -->
    <div class="section-card">
      <h3>📦 Meu Estoque (O que tem hoje?)</h3>
      <div id="lista-estoque" class="grid-estoque"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
